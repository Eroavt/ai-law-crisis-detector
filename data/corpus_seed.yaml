# Corpus generation matrix.
#
# MVP build (Day 1, 2-hour block): use mvp_recipe — 35 dialogues across all 7 axes.
# Full build (Day 1 afternoon): use full_recipe — ~150 dialogues stratified across
#   axes × severities × demographics × lengths.
#
# Each entry under a recipe is one dialogue specification. The corpus generator
# emits one Conversation per entry, validated against schemas.Conversation.

mvp_recipe:
