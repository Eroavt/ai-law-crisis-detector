[project]
name = "aldc"
version = "0.1.0"
description = "AI-Law Crisis Detector: research artifact grounding legal claims about LLM developer duty of care in suicidal-crisis interactions."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Erik Avtandilyan", email = "ero.avt@gmail.com" },
    { name = "Athira Ashokan" },
    { name = "Nishant Kumar Singh" },
]
license = { text = "MIT" }
keywords = ["ai-safety", "suicide-prevention", "ai-law", "eu-ai-act", "swiss-law"]

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "streamlit>=1.40",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
live = [
    "openai>=1.50",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aldc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "python-docx>=1.2.0",
]
