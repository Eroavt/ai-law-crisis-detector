name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.11"
      - name: Sync deps (with dev)
        run: uv sync --extra dev
      - name: Pytest
        run: uv run pytest -q
      - name: Lint (ruff)
        run: uv run ruff check src/ app/ scripts/ tests/
      - name: Schema parses
        run: |
          uv run python -c "from aldc.schemas import Conversation, DetectionResult; print('schemas OK')"
          uv run python -c "from aldc.legal_map import assert_total; assert_total(); print('legal_map total ✓')"
      - name: Demo imports cleanly
        run: |
          uv run python -c "import ast, sys; src=open('app/demo.py').read(); ast.parse(src); print('demo.py parses OK')"
